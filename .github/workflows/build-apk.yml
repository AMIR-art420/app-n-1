name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk payamresan-beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: payamresan-apk
          path: payamresan-beta.apk
      # لینک دانلود ثابت: https://github.com/USER/REPO/releases/latest/download/payamresan-beta.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-${{ github.run_number }}
          name: Beta ${{ github.run_number }}
          files: payamresan-beta.apk
          make_latest: true
